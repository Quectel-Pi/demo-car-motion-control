<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f9ff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1420">
  <title>Mecanum car control</title>
  <script>
    /* 系统深色模式：让 3D 舞台也切到暗色皮肤（car3d.js 会读这个全局变量） */
    (function () {
      try {
        var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
        if (mq && mq.matches) window.WHEEL_STAGE_THEME = 'dark';
      } catch (_) {}
    })();
  </script>
  <style>
    :root {
      --bg: #f4f8ff;
      --fg: #17212e;
      --muted: #6b7c93;
      --line: rgba(23, 33, 46, 0.12);
      --brand: #2f6fed;
      --danger: #e5484d;
      --ok: #1f9d55;
      --warn: #d9822b;
      --card: #ffffff;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--bg); color: var(--fg);
      font: 15px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      overscroll-behavior: none; touch-action: manipulation;
    }
    body { display: flex; flex-direction: column; min-height: 100dvh; overflow-x: hidden; }

    /* top bar: status + e-stop only */
    .bar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px calc(8px + env(safe-area-inset-top)) 12px;
      background: var(--card); border-bottom: 1px solid var(--line);
      padding-top: calc(8px + env(safe-area-inset-top));
      position: sticky; top: 0; z-index: 10;
    }
    .bar .grow { flex: 1; min-width: 0; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      font-size: 11.5px; padding: 3px 8px; border-radius: 999px;
      background: rgba(47, 111, 237, 0.08); color: var(--muted); white-space: nowrap;
    }
    .chip.ok { background: rgba(31, 157, 85, 0.12); color: var(--ok); }
    .chip.err { background: rgba(229, 72, 77, 0.12); color: var(--danger); }
    .chip.sim { background: rgba(217, 130, 43, 0.14); color: var(--warn); }
    .estop {
      border: 0; border-radius: 12px; padding: 10px 14px;
      background: var(--danger); color: #fff; font-weight: 700; font-size: 14px;
    }


    /* 状态信息：标签 + 值分列，长内容自动换行，不再被截断 */
    .stat-rows { display: flex; flex-direction: column; gap: 5px; margin-bottom: 6px; }
    .stat-row { display: flex; align-items: baseline; gap: 10px; font-size: 12.5px; line-height: 1.35; }
    .stat-k { flex: 0 0 58px; color: var(--muted); }
    .stat-v { flex: 1 1 auto; min-width: 0; word-break: break-word; color: var(--fg); }
    .stat-v.ok { color: #1a7f37; }
    .stat-v.err { color: #d1242f; }
    .stat-v.sim { color: #9a6700; }


    /* 常驻运行日志：始终可见，最近 6 行，自动滚到底 */
    /* 下拉里的分组标题 */
    .demo-picker-group {
      padding: 10px 14px 4px; font-size: 11px; letter-spacing: .04em;
      color: var(--muted); text-transform: uppercase;
    }

    .live-log {
      border: 1px solid var(--line); border-radius: 12px; background: var(--card);
      overflow: hidden; flex: 0 0 auto;
    }
    .live-log-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 10px; font-size: 11.5px; color: var(--muted);
      border-bottom: 1px solid var(--line);
    }
    .live-log-actions button {
      border: 0; background: transparent; color: var(--muted);
      font-size: 11.5px; padding: 0 2px;
    }
    .live-log-body {
      height: 96px; overflow-y: auto; padding: 6px 10px;
      font: 11.5px/1.45 "Cascadia Mono", Consolas, monospace;
      color: var(--fg); white-space: pre-wrap; word-break: break-word;
    }
    .live-log-body .t { color: var(--muted); margin-right: 6px; }
    .live-log-body .ok { color: var(--ok); }
    .live-log-body .warn { color: var(--warn); }
    .live-log-body .err { color: var(--danger); }
    @media (prefers-color-scheme: dark) {
      .live-log { background: #111c2b; }
    }

    /* 页面最前面的 Demo 区块（顶栏已移除） */
    .demo-top {
      display: flex; flex-direction: column; gap: 8px;
      padding: 10px 12px 12px;
      background: #fff; border-bottom: 1px solid var(--line);
    }
    /* 自绘下拉：原生 select 在手机上箭头太小、难点击，这里改成整行大按钮 + 大行高列表 */
    .demo-select-native { display: none; }
    .demo-picker { position: relative; }
    .demo-picker-btn {
      width: 100%; min-height: 48px; display: flex; align-items: center; gap: 8px;
      padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
      background: #fff; color: var(--fg); font-size: 14px; text-align: left;
      -webkit-tap-highlight-color: transparent;
    }
    .demo-picker-btn:active { background: #f2f6ff; }
    .demo-picker-label { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .demo-picker-chev { flex: 0 0 auto; font-size: 16px; color: var(--muted); padding-left: 6px; }
    .demo-picker-sheet {
      position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 40;
      max-height: 46vh; overflow-y: auto; padding: 6px;
      background: #fff; border: 1px solid var(--line); border-radius: 12px;
      box-shadow: 0 12px 30px rgba(15, 35, 70, .18);
    }
    .demo-picker-item {
      display: block; width: 100%; min-height: 46px; padding: 12px 12px;
      border: 0; background: transparent; text-align: left; font-size: 14px; color: var(--fg);
      border-radius: 9px; -webkit-tap-highlight-color: transparent;
    }
    .demo-picker-item + .demo-picker-item { margin-top: 2px; }
    .demo-picker-item:active { background: #eef4ff; }
    .demo-picker-item.selected { background: #e7f0ff; font-weight: 700; }
    .demo-btns { display: flex; gap: 8px; }
    .demo-btns .btn { flex: 1 1 0; padding: 11px 8px; font-size: 15px; }
    .demo-progress { height: 3px; border-radius: 2px; background: rgba(47,111,237,.12); overflow: hidden; }
    .demo-progress > div { height: 100%; width: 0; background: var(--brand); transition: width .2s linear; }

    /* 只有 Stop / Center 两个按钮，各占一半 */
    .btns .btn { flex: 1 1 0; padding: 13px 8px; font-size: 15px; }

    .head-select {
      flex: 1 1 auto; min-width: 0; max-width: 40vw;
      padding: 7px 8px; border-radius: 10px; border: 1px solid var(--line);
      background: #fff; font-size: 12.5px; color: var(--fg);
    }
    .head-btn { flex: 0 0 auto; padding: 8px 10px; font-size: 12.5px; white-space: nowrap; }
    .bar .estop { padding: 8px 10px; font-size: 12px; white-space: nowrap; }
    .head-progress {
      position: absolute; left: 0; right: 0; bottom: 0; height: 3px;
      background: rgba(47, 111, 237, 0.12);
    }
    .head-progress-bar { height: 100%; width: 0%; background: var(--brand); transition: width 0.2s linear; }

    /* 3D stage */
    .stage { position: relative; flex: 0 0 auto; height: 40dvh; min-height: 200px; background: #eaf1fb; }
    #stage3d { display: block; width: 100%; height: 100%; }
    .hint {
      position: absolute; left: 10px; bottom: 8px; font-size: 11.5px; color: var(--muted);
      background: rgba(255, 255, 255, 0.72); padding: 2px 8px; border-radius: 999px;
    }
    .action {
      position: absolute; left: 10px; top: 10px; font-weight: 700; font-size: 14px;
      background: rgba(255, 255, 255, 0.8); padding: 4px 10px; border-radius: 10px;
    }

    /* control area */
    main { flex: 1; display: flex; flex-direction: column; gap: 10px; padding: 12px; }
    .pad-wrap { display: flex; align-items: center; gap: 14px; }
    .joy {
      position: relative; width: min(46vw, 190px); aspect-ratio: 1; flex: 0 0 auto;
      border-radius: 50%; background: radial-gradient(circle at 50% 45%, #fff 0%, #e6eefc 70%, #d9e5fa 100%);
      border: 1px solid var(--line); touch-action: none;
    }
    .joy .cross, .joy .ring {
      position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    }
    .joy .ring { border: 1px dashed rgba(47, 111, 237, 0.25); inset: 18%; }
    .joy .axis-v { position: absolute; left: 50%; top: 8%; bottom: 8%; width: 1px; background: rgba(47,111,237,0.14); }
    .joy .axis-h { position: absolute; top: 50%; left: 8%; right: 8%; height: 1px; background: rgba(47,111,237,0.14); }
    .knob {
      position: absolute; left: 50%; top: 50%; width: 40%; height: 40%;
      margin: -20% 0 0 -20%; border-radius: 50%;
      background: linear-gradient(160deg, #6fa0ff, #2f6fed);
      box-shadow: 0 6px 14px rgba(47, 111, 237, 0.35);
    }
    .joy .dir { position: absolute; font-size: 11px; color: var(--muted); }
    .joy .dir.n { left: 50%; top: 6px; transform: translateX(-50%); }
    .joy .dir.s { left: 50%; bottom: 6px; transform: translateX(-50%); }
    .joy .dir.w { left: 7px; top: 50%; transform: translateY(-50%); }
    .joy .dir.e { right: 7px; top: 50%; transform: translateY(-50%); }

    .side { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    /* 速度/自转：名称 + 滑杆 + 数值放在同一行，省掉一半高度 */
    .ctl-row { display: flex; align-items: center; gap: 10px; min-height: 30px; }
    .ctl-name { flex: 0 0 48px; font-size: 13px; color: var(--muted); }
    .ctl-val { flex: 0 0 42px; text-align: right; font-size: 14px; font-variant-numeric: tabular-nums; }
    .ctl-row input[type="range"] { flex: 1 1 auto; min-width: 0; }
    .speed-head { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }
    .speed-head b { color: var(--fg); font-size: 15px; }
    input[type="range"] {
      width: 100%; height: 34px; -webkit-appearance: none; background: transparent;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 8px; border-radius: 999px; background: linear-gradient(90deg, #cfe0ff, #7aa7ff);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 26px; height: 26px; margin-top: -9px;
      border-radius: 50%; background: #fff; border: 3px solid var(--brand);
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .btns { display: flex; gap: 8px; }
    .btn {
      flex: 1; border: 1px solid var(--line); background: var(--card); color: var(--fg);
      border-radius: 12px; padding: 12px 10px; font-size: 15px; font-weight: 600;
    }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
    .btn.ghost { background: transparent; }

    /* More (collapsed by default) */
    details.more { border: 1px solid var(--line); border-radius: 12px; background: var(--card); overflow: hidden; }
    details.more > summary {
      list-style: none; cursor: pointer; padding: 12px 14px; font-weight: 600; font-size: 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    details.more > summary::-webkit-details-marker { display: none; }
    details.more[open] > summary { border-bottom: 1px solid var(--line); }
    .more-body { padding: 12px 14px; display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; align-items: center; gap: 10px; }
    .row .name { width: 74px; font-size: 13px; color: var(--muted); flex: 0 0 auto; }
    .row output { width: 42px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
    /* 演示行：英文标题较长 + 两个按钮，窄屏放不下 → 下拉独占一行，按钮换行。
       用 .row.demo-row 提高优先级，否则会被后面的 .row select 覆盖。 */
    .row.demo-row { flex-wrap: wrap; row-gap: 8px; }
    .row.demo-row select { flex: 1 1 100%; min-width: 0; order: 1; }
    .row.demo-row .btn { flex: 1 1 42%; order: 2; min-width: 0; padding: 10px 8px; font-size: 14px; }

    .row select {
      flex: 1; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
      background: #fff; font-size: 14px;
    }
    .log { max-height: 120px; overflow: auto; font-size: 12px; color: var(--muted); }
    .log div { padding: 2px 0; border-bottom: 1px dashed rgba(23,33,46,0.06); }
    .fallback {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      padding: 20px; text-align: center; font-size: 13px; color: var(--muted);
    }
    .offline {
      position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px;
      background: var(--danger); color: #fff; font-size: 13px; text-align: center;
    }
    /* phone layout: stack stick row and slider/button row to avoid horizontal overflow */
    @media (max-width: 620px) {
      .pad-wrap { flex-direction: column; align-items: stretch; gap: 12px; }
      .joy { width: min(64vw, 220px); margin: 0 auto; }
      .side { width: 100%; }
      .chips { flex-wrap: nowrap; overflow: hidden; }
      .chip { overflow: hidden; text-overflow: ellipsis; }
      .bar { gap: 6px; }
      .estop { padding: 10px 12px; font-size: 13px; }
      .stage { height: 34dvh; min-height: 170px; }
    }

    /* ================= 深色主题（跟随系统设置） ================= */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0b1420;
        --fg: #e7eefb;
        --muted: #8ea3bf;
        --line: rgba(231, 238, 251, 0.14);
        --card: #111c2b;
        --brand: #4f8dff;
        --danger: #ff6b70;
        --ok: #46d38a;
        --warn: #ffb454;
      }
      body { background: var(--bg); color: var(--fg); }
      .demo-top, .bar { background: var(--card); }
      .demo-picker-btn { background: #16233a; color: var(--fg); }
      .demo-picker-btn:active { background: #1c2c46; }
      .demo-picker-sheet {
        background: #16233a; border-color: var(--line);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55);
      }
      .demo-picker-item:active { background: #1c2c46; }
      .demo-picker-item.selected { background: #1f3352; }
      .head-select, .row select { background: #16233a; color: var(--fg); }
      .stat-v.ok { color: #46d38a; }
      .stat-v.err { color: #ff8b8f; }
      .stat-v.sim { color: #ffc46b; }
      .stage { background: #0d1826; }
      .hint { background: rgba(11, 20, 32, 0.72); color: var(--muted); }
      .action { background: rgba(11, 20, 32, 0.75); color: var(--fg); }
      .joy {
        background: radial-gradient(circle at 50% 45%, #1b2942 0%, #131f31 70%, #0f1a29 100%);
        border-color: var(--line);
      }
      .joy .ring { border-color: rgba(96, 165, 250, 0.28); }
      .joy .axis-v, .joy .axis-h { background: rgba(96, 165, 250, 0.18); }
      input[type="range"]::-webkit-slider-runnable-track {
        background: linear-gradient(90deg, #1f3a63, #3d6fd1);
      }
      input[type="range"]::-webkit-slider-thumb {
        background: #dfe9f8; border-color: var(--brand);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
      }
      .log div { border-bottom-color: rgba(231, 238, 251, 0.08); }
      .demo-progress, .head-progress { background: rgba(79, 141, 255, 0.22); }
      .chip { background: rgba(79, 141, 255, 0.14); }
      details.more, .btn { background: var(--card); color: var(--fg); }
      .btn.ghost { background: transparent; }
    }

    @media (min-width: 720px) {
      .stage { height: 46dvh; }
      .joy { width: 210px; }
      main { max-width: 760px; margin: 0 auto; width: 100%; }
    }
  </style>
</head>
<body>
  <section class="demo-top">
    <div class="demo-picker">
      <button class="demo-picker-btn" id="demo-picker-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
        <span class="demo-picker-label" id="demo-picker-label">Loading demos...</span>
        <span class="demo-picker-chev">▾</span>
      </button>
      <div class="demo-picker-sheet" id="demo-picker-sheet" hidden role="listbox"></div>
    </div>
    <select id="demo-select" class="demo-select-native" aria-hidden="true" tabindex="-1"></select>
    <div class="demo-btns">
      <button class="btn primary" id="btn-demo-start" type="button">Demo</button>
      <button class="btn ghost" id="btn-demo-stop" type="button">Stop</button>
    </div>
    <div class="demo-progress"><div id="demo-progress"></div></div>
  </section>

  <section class="stage">
    <canvas id="stage3d"></canvas>
    <div class="action" id="action">Stopped</div>
    <div class="hint" id="hint">3D view · drag to rotate</div>
  </section>

  <main>
    <div class="pad-wrap">
      <div class="joy" id="joy">
        <div class="cross"><div class="axis-v"></div><div class="axis-h"></div></div>
        <div class="ring"></div>
        <span class="dir n">FWD</span><span class="dir s">REV</span>
        <span class="dir w">LEFT</span><span class="dir e">RIGHT</span>
        <div class="knob" id="knob"></div>
      </div>
      <div class="side">
        <div class="ctl-row">
          <span class="ctl-name">Speed</span>
          <input type="range" id="speed" min="0" max="80" step="5" value="0">
          <b class="ctl-val" id="speed-out">0%</b>
        </div>
        <div class="ctl-row">
          <span class="ctl-name">Spin</span>
          <input type="range" id="rot" min="-60" max="60" step="5" value="0">
          <b class="ctl-val" id="rot-out">0%</b>
        </div>
        <div class="btns">
          <button class="btn primary" id="btn-stop" type="button" title="stop (long-press 0.8s = emergency stop)">Stop</button>
          <button class="btn ghost" id="btn-center" type="button" title="reset stick to centre">Center</button>
        </div>
      </div>
    </div>

    <div class="live-log">
      <div class="live-log-head">
        <span>Log</span>
        <span class="live-log-actions"><button type="button" id="btn-log-clear">clear</button></span>
      </div>
      <div class="live-log-body" id="live-log-body"></div>
    </div>

    <details class="more">
      <summary><span>More (check / demo / log)</span><span id="more-flag">▾</span></summary>
      <div class="more-body">
        <div class="stat-rows" id="chips">
          <div class="stat-row"><span class="stat-k">Link</span><span class="stat-v" id="chip-link">-</span></div>
          <div class="stat-row"><span class="stat-k">Battery</span><span class="stat-v" id="chip-battery">-</span></div>
          <div class="stat-row"><span class="stat-k">RTT</span><span class="stat-v" id="chip-rtt" title="real HTTP round trip measured by this page">-</span></div>
          <div class="stat-row"><span class="stat-k">IMU</span><span class="stat-v" id="chip-imu" title="MPU6050 heading">-</span></div>
          <div class="stat-row"><span class="stat-k">Stall</span><span class="stat-v" id="chip-stall" title="stall guard trips (voltage sag)">-</span></div>
        </div>
        <div class="row"><span class="name">FL (M1)</span><input type="range" min="-100" max="100" step="5" value="0" data-wheel="0"><output>0</output></div>
        <div class="row"><span class="name">FR (M3)</span><input type="range" min="-100" max="100" step="5" value="0" data-wheel="1"><output>0</output></div>
        <div class="row"><span class="name">RR (M4)</span><input type="range" min="-100" max="100" step="5" value="0" data-wheel="2"><output>0</output></div>
        <div class="row"><span class="name">RL (M2)</span><input type="range" min="-100" max="100" step="5" value="0" data-wheel="3"><output>0</output></div>
        <div class="btns">
          <button class="btn ghost" id="btn-wheel-zero" type="button">Zero all</button>
          <button class="btn ghost" id="btn-imu-calib" type="button" title="car must be standing still">IMU calib</button>
        </div>
        <div class="log" id="log"></div>
      </div>
    </details>
  </main>

  <script src="/vendor/three.min.js"></script>
  <script src="/car3d.js"></script>
  <script src="/mobile.js"></script>
</body>
</html>
